name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, build, and check the web image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from package-lock.json
        run: npm ci --no-audit --no-fund

      - name: Verify repository foundation
        run: npm test

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run workspace typecheck
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build

      - name: Check production web Docker build
        run: npm run docker:check
